{% extends 'base.html' %}
{% block title %}Report an Issue{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow p-4">
      <h3 class="mb-4"><span class="text-warning" aria-hidden="true">⚠</span> Report a Civic Issue</h3>
      <form method="POST" enctype="multipart/form-data" id="reportForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Full Name *</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Category (optional — AI will auto-detect)</label>
            <select name="category" class="form-select">
              <option value="">Let AI Decide</option>
              {% for c in categories %}
              <option value="{{ c }}">{{ c.replace('_',' ').title() }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload Photo of the Issue *</label>
          <input type="file" name="image" id="imageInput" class="form-control" accept="image/*" required>
          <img id="preview" class="mt-2 rounded" style="max-height:250px; display:none;">
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" rows="3" class="form-control"
            placeholder="Describe the issue (mention if urgent, near school, etc.)"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" name="address" class="form-control" placeholder="Street, Area, City">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Latitude</label>
            <input type="text" name="latitude" id="lat" class="form-control" readonly>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Longitude</label>
            <input type="text" name="longitude" id="lon" class="form-control" readonly>
          </div>
        </div>
        <button type="button" class="btn btn-outline-primary mb-3" onclick="getLocation()">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-3px"><path d="M12 21s6-5.3 6-12a6 6 0 10-12 0c0 6.7 6 12 6 12z"/><circle cx="12" cy="9" r="2"/></svg>
          Use Current Location
        </button>
        <div id="locationStatus" class="small text-muted mb-3"></div>

        <div class="d-grid">
          <button type="submit" class="btn btn-warning btn-lg">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-3px"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            Submit Report (AI will analyze)
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('imageInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
});

function getLocation(){
  const status = document.getElementById('locationStatus');
  if(!navigator.geolocation){
    status.textContent = 'Location services are not supported by this browser.';
    return;
  }
  status.textContent = 'Getting your precise location...';
  navigator.geolocation.getCurrentPosition(function(pos){
    document.getElementById('lat').value = pos.coords.latitude.toFixed(7);
    document.getElementById('lon').value = pos.coords.longitude.toFixed(7);
    status.textContent = `Location captured with ±${Math.round(pos.coords.accuracy)} m accuracy.`;
  }, function(error){
    status.textContent = error.code === 1
      ? 'Location permission was denied.'
      : 'We could not determine your precise location.';
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
}
</script>
{% endblock %}
